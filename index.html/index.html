<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Page</title>
<style>
:root {
  --nav: 64px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0f;
  color: #fff;
  font-family: 'Segoe UI', sans-serif;
  overflow-x: hidden;
}

/* Grain effect */
@keyframes grain {
  0%   { transform: translate(0, 0); }
  20%  { transform: translate(-30px, 18px); }
  40%  { transform: translate(22px, -26px); }
  60%  { transform: translate(-18px, -12px); }
  80%  { transform: translate(28px, 24px); }
  100% { transform: translate(0, 0); }
}

.fx-grain {
  position: fixed;
  inset: -100%;
  z-index: 10;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  animation: grain 8s steps(10) infinite;
}

/* Steps */
.steps {
  position: absolute;
  inset: var(--nav) 0 0;
  z-index: 6;
  pointer-events: none;
}

.step {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}

.step.active {
  opacity: 1;
  visibility: visible;
}

.step .in {
  position: relative;
  width: min(840px, calc(100% - 3rem));
  text-align: center;
}

.step h2 {
  font-size: clamp(2rem, 5vw, 4rem);
  margin-bottom: 1rem;
}

.step p {
  font-size: clamp(1rem, 2vw, 1.4rem);
  opacity: 0.7;
}

/* Glow / Breathe */
.fx-glow {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 34% 44% at 50% 54%, rgba(255,150,60,.2), transparent 72%),
    radial-gradient(ellipse 70% 40% at 50% 100%, rgba(70,110,170,.14), transparent 70%);
  animation: breathe 7s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: .75; }
  50%      { opacity: 1; }
}

/* Dust canvas */
#dust {
  position: fixed;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* Grade overlay */
.fx-grade {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background:
    radial-gradient(ellipse 46% 52% at 50% 46%, rgba(255,170,90,.1), transparent 70%),
    linear-gradient(to bottom, rgba(10,20,40,.18), transparent 30%, transparent 70%, rgba(0,0,0,.2));
}

/* Sections */
section {
  min-height: 100vh;
  display: grid;
  place-items: center;
  position: relative;
  z-index: 4;
}

section h1 {
  font-size: clamp(3rem, 8vw, 7rem);
  letter-spacing: -0.02em;
}

/* Nav */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--nav);
  z-index: 8;
  display: flex;
  align-items: center;
  padding: 0 2rem;
  backdrop-filter: blur(8px);
  background: rgba(10,10,15,.6);
}

nav span {
  font-weight: 600;
  font-size: 1.1rem;
}
</style>
</head>
<body>

<nav><span>CINEMA</span></nav>

<div class="fx-glow"></div>
<canvas id="dust"></canvas>
<div class="fx-grade"></div>
<div class="fx-grain"></div>

<div class="steps">
  <div class="step active">
    <div class="in">
      <h2>Шаг 1</h2>
      <p>Откройте для себя новую реальность</p>
    </div>
  </div>
  <div class="step">
    <div class="in">
      <h2>Шаг 2</h2>
      <p>Погрузитесь в атмосферу</p>
    </div>
  </div>
  <div class="step">
    <div class="in">
      <h2>Шаг 3</h2>
      <p>Станьте частью истории</p>
    </div>
  </div>
</div>

<section>
  <h1>Добро пожаловать</h1>
</section>

<script>
(function () {
  /* ===== Dust Particles ===== */
  const canvas = document.getElementById('dust');
  const g = canvas.getContext('2d');
  let W, H;
  let run = true;
  let last = 0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Create particles
  const COUNT = 120;
  const P = [];
  for (let i = 0; i < COUNT; i++) {
    P.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.5 + 0.5,
      v: Math.random() * 0.00005 + 0.00002,
      s: Math.random() * Math.PI * 2,
      a: Math.random() * 0.3 + 0.1
    });
  }

  function tick(t) {
    if (!run) return;
    requestAnimationFrame(tick);
    if (t - last < 33) return;
    const dt = t - last;
    last = t;

    g.clearRect(0, 0, W, H);

    for (const p of P) {
      p.y -= p.v * dt;
      p.x += Math.sin(t / 2600 + p.s) * 0.00012 * dt;

      if (p.y < -0.05) {
        p.y = 1.05;
        p.x = Math.random();
      }

      const x = p.x * W;
      const y = p.y * H;
      const r = p.r * (W / 900 + 0.7);
      const a = p.a * (0.6 + 0.4 * Math.sin(t / 900 + p.s));

      const gr = g.createRadialGradient(x, y, 0, x, y, r * 3);
      gr.addColorStop(0, "rgba(255,214,160," + a + ")");
      gr.addColorStop(1, "rgba(255,214,160,0)");
      g.fillStyle = gr;
      g.beginPath();
      g.arc(x, y, r * 3, 0, 6.283);
      g.fill();
    }
  }
  tick(0);

  // Pause when tab hidden
  document.addEventListener('visibilitychange', () => {
    run = !document.hidden;
    if (run) { last = performance.now(); requestAnimationFrame(tick); }
  });

  /* ===== Scroll Animation (steps) ===== */
  const steps = document.querySelectorAll('.step');
  const sections = document.querySelectorAll('section');

  function animate() {
    const scrollY = window.scrollY;
    const vh = window.innerHeight;
    const total = steps.length;

    const progress = Math.min(scrollY / (vh * total), 1);
    const idx = Math.min(Math.floor(progress * total), total - 1);

    steps.forEach((s, i) => {
      s.classList.toggle('active', i === idx);
    });

    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
</body>
</html>
